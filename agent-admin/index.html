<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Admin · CAGE ADMIN 5.0</title>
<link rel="stylesheet" href="../shared/cage-ui.css">
<style>
/* agent-admin-only additions */
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:12.5px;}
.kv-grid span{color:var(--ink-faint);}
.kv-grid b{color:var(--ink);font-weight:600;}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:200px;}
.nav-foot-btns{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.search-inline{width:100%;background:var(--void);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:var(--radius);font-size:12px;}
.search-inline:focus{outline:none;border-color:var(--brass);}
.nav-foot-btns button{font-size:10px;padding:5px 8px;opacity:.55;background:transparent;border:1px solid var(--line);color:var(--ink-faint);border-radius:4px;transition:.15s;}
.nav-foot-btns button:hover{opacity:1;border-color:var(--brass-dim);color:var(--brass);}
.toggle-grid{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:center;font-size:12.5px;}
.toggle-grid .th{color:var(--ink-faint);font-weight:700;font-size:11px;}
.toggle-grid label{display:flex;align-items:center;gap:6px;justify-content:center;}
.limit-table{width:100%;border-collapse:collapse;font-size:11.5px;}
.limit-table th,.limit-table td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;}
.limit-table td:first-child,.limit-table th:first-child{text-align:left;}
.rate-badge{font-family:var(--mono);color:var(--brass);font-weight:700;}
</style>
</head>
<body>

<div id="login-gate">
  <div class="login-card">
    <button type="button" class="icon-btn login-theme-btn theme-toggle-btn" onclick="toggleLoginTheme()" data-i18n-title="displaySettings" title="화면 설정">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <div class="login-mark">AGENT ADMIN</div>
    <div class="login-ver">v5.0</div>
    <div class="login-lang-row" id="loginLangRow"></div>
    <div class="field" style="margin-top:22px;"><label data-i18n="agentIdLabel">에이전트 ID</label><input id="loginId" placeholder="agent" autocomplete="off"></div>
    <div class="field"><label data-i18n="loginPw">비밀번호</label><input id="loginPw" type="password" placeholder="••••" autocomplete="new-password"></div>
    <p class="login-error" id="loginErr" data-i18n="agentLoginErr" style="display:none;">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <button class="btn btn-gold btn-block" onclick="doLogin()" data-i18n="loginBtn">로그인</button>
    <p class="login-hint"><span data-i18n="demoAccountLabel">데모 계정</span>: <b style="color:var(--ink-dim);">agent / 0000</b></p>
    <p class="login-hint" id="seedHint" data-i18n="agentSeedHint">최초 실행 시 데모 데이터가 없으면 로그인 후 좌측 하단 "데모 데이터 생성"을 눌러주세요.</p>
  </div>
</div>

<div class="topbar" style="display:none;" id="topbar">
  <div class="brand"><span class="mark">AGENT ADMIN</span><span class="ver">v5.0</span></div>
  <div class="divider-v"></div>
  <div class="topbar-meta">
    <span id="clockTxt" class="num">—</span>
    <span><span class="badge-dot" id="connDot"></span> <span data-i18n="liveSyncLabel">실시간 연동</span></span>
  </div>
  <div class="topbar-meta" style="margin-left:auto;">
    <button type="button" class="icon-btn theme-toggle-btn" onclick="toggleLoginTheme()" data-i18n-title="displaySettings" title="화면 설정">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <span id="hdrLangRow"></span>
    <span data-i18n="agentColonLabel">에이전트:</span><b id="staffNameTxt">—</b>
    <button class="btn btn-sm btn-ghost" onclick="doLogout()" data-i18n="logout">로그아웃</button>
  </div>
</div>

<div class="shell" id="shell" style="display:none;">
  <div class="nav" id="navBar"></div>
  <div class="main">
    <div id="mainArea"></div>
  </div>
</div>

<!-- generic balance adjust modal (자금 이체 / 자금 회수) -->
<div class="modal-bg" id="modal-balance"><div class="modal">
  <button class="modal-close" onclick="closeModal('modal-balance')">×</button>
  <h3 id="balanceModalTitle">자금 이체</h3>
  <p class="hint" id="balanceModalSub"></p>
  <div class="field"><label data-i18n="amountLabel">금액</label><input id="balanceAmt" type="text" inputmode="numeric" placeholder="0" oninput="formatNumInput(this)"></div>
  <div class="field"><label data-i18n="memoLabel">메모</label><textarea id="balanceMemo" data-i18n-ph="memoPh" placeholder="사유를 입력하세요"></textarea></div>
  <div class="modal-foot">
    <button class="btn" onclick="closeModal('modal-balance')" data-i18n="cancelBtn">취소</button>
    <button class="btn btn-gold" onclick="submitBalanceAdjust()" data-i18n="processBtn">처리</button>
  </div>
</div></div>

<!-- generic simple create/edit form modal -->
<div class="modal-bg" id="modal-form"><div class="modal">
  <button class="modal-close" onclick="closeModal('modal-form')">×</button>
  <h3 id="formModalTitle">생성</h3>
  <div id="formModalBody"></div>
  <div class="modal-foot">
    <button class="btn" onclick="closeModal('modal-form')" data-i18n="cancelBtn">취소</button>
    <button class="btn btn-gold" id="formModalSubmitBtn" data-i18n="saveBtn">저장</button>
  </div>
</div></div>

<!-- confirm modal -->
<div class="modal-bg" id="modal-confirm"><div class="modal" style="width:380px;">
  <h3 id="confirmTitle">확인</h3>
  <p class="hint" id="confirmBody" style="font-size:13px;color:var(--ink-dim);"></p>
  <div class="modal-foot">
    <button class="btn" onclick="closeModal('modal-confirm')" data-i18n="cancelBtn">취소</button>
    <button class="btn btn-danger-fill" id="confirmOkBtn" data-i18n="confirmBtn">확인</button>
  </div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/cage-ui.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
