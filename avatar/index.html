<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Speed · CAGE ADMIN 5.0</title>
<link rel="stylesheet" href="../shared/cage-ui.css">
<link rel="stylesheet" href="../shared/game-ui.css">
<script src="../shared/theme.js"></script>
<style>
body{overflow:auto;}
.shell-app{display:none;flex-direction:column;height:100%;}
/* The page's own styles are the two the shell needs; everything else it draws comes from
   shared/game-ui.css. The game picker and the separate speed lobby that used to be styled here
   are both gone - one lobby lists every table now. */
.card-status.live{background:rgba(255,255,255,.07);color:var(--brass);font-family:var(--mono);}
.card-status.live b{font-weight:800;}
</style>
</head>
<body>

<div id="login-gate">
  <div class="login-card">
    <button type="button" class="icon-btn login-theme-btn theme-toggle-btn" id="loginThemeBtn" onclick="toggleLoginTheme()" data-i18n-title="displaySettings" title="화면 설정">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <div class="login-mark">AVATAR SPEED</div>
    <div class="login-ver">v5.0</div>
    <div class="login-lang-row" id="loginLangRow"></div>

    <div id="pane-login">
      <div class="field" style="margin-top:22px;"><label data-i18n="loginId">아이디</label><input id="liId" autocomplete="off" placeholder="ID"></div>
      <div class="field"><label data-i18n="loginPw">비밀번호</label><input id="liPw" type="password" placeholder="••••" autocomplete="new-password"></div>
      <p class="login-error" id="liErr" style="display:none;"></p>
      <button class="btn btn-gold btn-block" data-i18n="loginBtn" onclick="onLogin()">로그인</button>
      <p class="login-switch"><span data-i18n="noAccountQ">계정이 없으신가요?</span> <a data-i18n="signupLink" onclick="showPane('signup')">회원가입</a></p>
      <p class="login-hint" data-i18n="demoHint">데모 계정은 파트너 어드민에서 "데모 데이터 생성" 후 유저리스트의 ID (PW: 0000)로 로그인할 수 있습니다.</p>
    </div>

    <div id="pane-signup" style="display:none;">
      <div class="field" style="margin-top:20px;">
        <label data-i18n="loginId">아이디</label>
        <div class="row" style="gap:8px;">
          <input id="suId" readonly data-i18n-ph="suIdPh" style="flex:1;">
          <button type="button" class="btn btn-sm" style="flex:0 0 auto;" data-i18n="suGenId" onclick="genSignupId()">신규 ID 생성</button>
        </div>
      </div>
      <div class="field"><label data-i18n="loginPw">비밀번호</label><input id="suPw" readonly data-i18n-ph="suPwGenerated"></div>
      <div class="field"><label data-i18n="suNick">닉네임</label><input id="suNick" data-i18n-ph="suNickPh"></div>
      <div class="field"><label data-i18n="suTelegram">텔레그램 ID</label><input id="suTelegram" placeholder="@" data-i18n-ph="suTelegramPh"></div>
      <div class="field">
        <label data-i18n="suPhone">전화번호</label>
        <div class="row" style="gap:8px;">
          <input id="suPhone" placeholder="010-0000-0000" style="flex:1;">
          <button type="button" class="btn btn-sm" style="flex:0 0 auto;" data-i18n="suSendCode" onclick="sendSignupCode()">인증번호 발송</button>
        </div>
      </div>
      <div class="field">
        <label data-i18n="suCode">인증번호 입력</label>
        <div class="row" style="gap:8px;">
          <input id="suCode" data-i18n-ph="suCodePh" style="flex:1;">
          <button type="button" class="btn btn-sm" style="flex:0 0 auto;" data-i18n="suVerifyCode" onclick="verifySignupCode()">인증번호 확인</button>
        </div>
        <p class="hint" id="suCodeStatus"></p>
      </div>
      <div class="field"><label data-i18n="suCasino">카지노</label><select id="suCasino"><option>NUSTAR</option><option>HANN</option><option>ONLINE</option></select></div>
      <div class="field"><label data-i18n="suAgent">추천인 코드 (선택)</label><input id="suAgent" placeholder="DIRECT"></div>
      <p class="login-error" id="suErr" style="display:none;"></p>
      <button class="btn btn-gold btn-block" data-i18n="suSubmit" onclick="onSignup()">가입하기</button>
      <p class="login-switch"><span data-i18n="haveAccountQ">이미 계정이 있으신가요?</span> <a data-i18n="loginBtn" onclick="showPane('login')">로그인</a></p>
    </div>
  </div>
</div>

<div class="shell-app" id="app" style="display:none;">
  <div class="game-header">
    <div class="brand">
      <svg class="brand-crest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l7 3.2v5.6c0 5-3 8.6-7 10.2-4-1.6-7-5.2-7-10.2V5.2L12 2z"/><path d="M9 11.5l2 2 4-4.5"/></svg>
      <span class="brand-text"><span class="mark">AVATAR SPEED</span><span class="sub">VIP CLUB</span></span>
    </div>
    <div class="balance-ticket"><span class="lbl" data-i18n="balance">보유금</span><span id="hdrBalance">0</span></div>
    <div class="points-ticket"><span class="lbl" data-i18n="points">포인트</span><span id="hdrPoints">0</span></div>
    <button class="icon-btn" id="favoriteBtn" onclick="toggleHeaderFavorite()" data-i18n-title="favorites" title="즐겨찾기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.35-9.5-8.8C.7 7.9 2 4.5 5.4 4c2-.3 3.7.6 4.6 2.2C10.9 4.6 12.6 3.7 14.6 4c3.4.5 4.7 3.9 2.9 7.2C15 15.65 12 20 12 20z"/></svg></button>
    <button class="icon-btn" id="hdrFsBtn" onclick="toggleBrowserFullscreen()" data-i18n-title="fullscreen" title="전체화면"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></svg></button>
    <div class="game-header-right">
      <span class="hdr-lang" id="hdrLangRow"></span>
      <button class="icon-btn theme-toggle-btn" onclick="toggleLoginTheme()" data-i18n-title="displaySettings" title="화면 설정">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="icon-btn" onclick="openGameHistory()" data-i18n-title="gameHistory" title="게임기록"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></button>
      <span class="hdr-nick" style="font-size:12px;color:var(--ink-dim);" id="hdrNick">—</span>
      <button class="btn btn-sm hdr-action-btn" id="avatarLobbyBtn" onclick="backToAvatarLobby()" style="display:none;" data-i18n-title="tableList" title="테이블 목록"><svg class="hdr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg><span class="hdr-lbl" data-i18n="tableList">테이블 목록</span></button>
      <button class="btn btn-sm btn-ghost hdr-action-btn" onclick="onLogout()" data-i18n-title="logout" title="로그아웃"><svg class="hdr-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="hdr-lbl" data-i18n="logout">로그아웃</span></button>
    </div>
  </div>

  <!-- One lobby, listing every table there is. The two used to be separate screens reached
       through a picker page, with a ☰ and a 게임 변경 button that both went back to it - three ways
       of saying the same thing as the 전체 / 아바타 / 스피드 pills, which is what does it now. -->
  <div id="viewLobby" style="display:none;"></div>
  <div id="viewAvatarTable" style="display:none;"></div>
  <div id="viewSpeedTable" style="display:none;"></div>
</div>

<div class="modal-bg" id="modal-history" data-fs-follow><div class="modal modal-sheet">
  <button class="modal-close" onclick="closeModal('modal-history')">×</button>
  <h3 data-i18n="gameHistory">게임기록</h3>
  <div class="tabs-mini" id="historyTabs">
    <button class="active" data-i18n="historyTabSpeed" onclick="renderGameHistory(this,'speed')">스피드 베팅</button>
    <button data-i18n="historyTabAvatar" onclick="renderGameHistory(this,'avatar')">아바타 베팅</button>
  </div>
  <div id="historyBody"></div>
</div></div>

<!-- avatar request modal -->
<div class="modal-bg" id="modal-avatar-request" data-fs-follow><div class="modal">
  <button class="modal-close" onclick="closeModal('modal-avatar-request')">×</button>
  <h3 data-i18n="requestModalTitle">아바타 대리베팅 신청</h3>
  <p class="hint" data-i18n="requestModalDesc">전담 아바타가 배정되면 테이블에서 라운드마다 직접 베팅하실 수 있습니다. 보유금에서 실시간으로 차감/지급됩니다.</p>
  <!-- whose account the buy-in comes out of, said before the amount is asked for -->
  <div class="field"><label data-i18n="reqAccountLabel">어카운트</label>
    <div class="req-account" id="reqAccount"></div>
  </div>
  <div class="field"><label data-i18n="buyinLabel">바이인 금액</label><input id="reqBuyin" type="text" inputmode="numeric" placeholder="100,000" oninput="formatNumInput(this)"></div>
  <button class="btn btn-gold btn-block" data-i18n="submitRequest" onclick="submitAvatarRequest()">신청하기</button>
</div></div>

<!-- tip modal -->
<div class="modal-bg" id="modal-tip" data-fs-follow><div class="modal" style="width:380px;">
  <button class="modal-close" onclick="closeModal('modal-tip')">×</button>
  <h3 data-i18n="tipModalTitle">팁 지급</h3>
  <!-- hidden on a speed table: there is no avatar there, so the dealer is the only recipient -->
  <div class="field" id="tipTargetField"><label data-i18n="tipTargetLabel">지급 대상</label>
    <select id="tipTarget">
      <option value="avatar" data-i18n="tipTargetAvatar">아바타</option>
      <option value="dealer" data-i18n="tipTargetDealer">딜러</option>
    </select>
  </div>
  <!-- The tip is built by handing over chips, the way it is done at a table, rather than typed.
       Tapping a chip adds it to the stack; the stack is what gets given. -->
  <div class="field"><label data-i18n="tipChipLabel">칩 선택</label>
    <div class="tip-chips" id="tipChips"></div>
  </div>
  <div class="tip-stack-row">
    <div class="tip-stack" id="tipStack"></div>
    <div class="tip-total"><span data-i18n="tipAmountLabel">팁 금액</span><b id="tipTotal">0</b></div>
  </div>
  <div class="tip-actions">
    <button class="btn btn-sm" onclick="undoTipChip()" data-i18n="tipUndo">되돌리기</button>
    <button class="btn btn-sm" onclick="clearTipChips()" data-i18n="tipClear">지우기</button>
  </div>
  <button class="btn btn-gold btn-block" id="tipSubmitBtn" data-i18n="giveTip" onclick="submitTip()">팁 지급</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/cage-ui.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/payout.js"></script>
<script src="../shared/game-engine.js"></script>
<script src="../shared/baccarat-ai.js"></script>
<script src="app.js"></script>
</body>
</html>
