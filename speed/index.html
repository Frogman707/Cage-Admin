<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed · CAGE ADMIN 5.0</title>
<link rel="stylesheet" href="../shared/cage-ui.css">
<link rel="stylesheet" href="../shared/game-ui.css">
<style>
body{overflow:auto;}
.shell-app{display:none;flex-direction:column;height:100%;}
.speed-wrap{padding:16px 20px 100px;max-width:1500px;margin:0 auto;}
.speed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.speed-tile{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 14px;}
.speed-tile .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.speed-tile .head .name{font-weight:700;font-size:13px;color:var(--ink);}
.speed-tile .head .shoe{font-size:10.5px;color:var(--ink-faint);font-family:var(--mono);}
.speed-mini-stage{position:relative;height:64px;border-radius:8px;background:radial-gradient(ellipse at 50% 20%, #103a2c 0%, #05140e 80%);display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden;}
.speed-mini-stage .phase-txt{font-size:11px;font-weight:700;color:var(--brass);}
.speed-mini-stage .score-txt{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--ink);}
.speed-timer{position:absolute;top:6px;right:8px;font-family:var(--mono);font-weight:800;font-size:13px;color:var(--brass);background:rgba(0,0,0,.5);border-radius:10px;padding:1px 7px;}
.speed-bets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;}
.speed-bets .bet-spot{padding:8px 4px;}
.speed-bets .bet-spot .label{font-size:12.5px;}
.speed-mini-road{display:flex;gap:2px;flex-wrap:wrap;}
.speed-mini-road span{width:9px;height:9px;border-radius:50%;}
.speed-mini-road span.player{background:#4A9FD8;}
.speed-mini-road span.banker{background:var(--danger);}
.speed-mini-road span.tie{background:var(--jade);}
.chip-tray-fixed{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--brass-dim);padding:10px 20px;display:flex;justify-content:center;}
</style>
</head>
<body>

<div id="login-gate">
  <div class="login-card">
    <div class="login-mark">SPEED</div>
    <div class="login-ver">v5.0</div>
    <div id="pane-login">
      <div class="field" style="margin-top:22px;"><label>아이디</label><input id="liId" autocomplete="off" placeholder="ID"></div>
      <div class="field"><label>비밀번호</label><input id="liPw" type="password" placeholder="••••"></div>
      <p class="login-error" id="liErr" style="display:none;"></p>
      <button class="btn btn-gold btn-block" onclick="onLogin()">로그인</button>
      <p class="login-switch">계정이 없으신가요? <a onclick="showPane('signup')">회원가입</a></p>
      <p class="login-hint">데모 계정은 파트너 어드민에서 "데모 데이터 생성" 후 유저리스트의 ID (PW: 0000)로 로그인할 수 있습니다.</p>
    </div>
    <div id="pane-signup" style="display:none;">
      <div class="field" style="margin-top:22px;"><label>아이디</label><input id="suId" autocomplete="off"></div>
      <div class="field"><label>비밀번호</label><input id="suPw" type="password"></div>
      <div class="field"><label>닉네임</label><input id="suNick"></div>
      <div class="field"><label>전화번호</label><input id="suPhone"></div>
      <div class="field"><label>카지노</label><select id="suCasino"><option>NUSTAR</option><option>HANN</option><option>ONLINE</option></select></div>
      <div class="field"><label>추천인 코드 (선택)</label><input id="suAgent" placeholder="DIRECT"></div>
      <p class="login-error" id="suErr" style="display:none;"></p>
      <button class="btn btn-gold btn-block" onclick="onSignup()">가입하기</button>
      <p class="login-switch">이미 계정이 있으신가요? <a onclick="showPane('login')">로그인</a></p>
    </div>
  </div>
</div>

<div class="shell-app" id="app" style="display:none;">
  <div class="game-header">
    <div class="brand"><span class="mark">SPEED</span></div>
    <div class="balance-ticket"><span class="lbl">보유금</span><span id="hdrBalance">0</span></div>
    <div class="points-ticket"><span class="lbl">포인트</span><span id="hdrPoints">0</span></div>
    <div class="game-header-right">
      <span style="font-size:12px;color:var(--ink-dim);" id="hdrNick">—</span>
      <button class="btn btn-sm btn-ghost" onclick="onLogout()">로그아웃</button>
    </div>
  </div>
  <div class="speed-wrap">
    <div class="lobby-title">스피드 테이블 <span style="font-size:11px;color:var(--ink-faint);font-weight:400;">— 여러 테이블을 동시에 베팅할 수 있습니다</span></div>
    <div class="speed-grid" id="speedGrid"><div class="spin"></div></div>
  </div>
  <div class="chip-tray-fixed" id="chipTray"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/cage-ui.js"></script>
<script src="../shared/game-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
