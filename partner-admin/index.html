<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Admin · CAGE ADMIN 5.0</title>
<link rel="stylesheet" href="../shared/cage-ui.css">
<style>
/* partner-admin-only additions */
.staircase-svg{width:64px;height:44px;}
.video-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.video-tile{background:var(--void);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;aspect-ratio:16/10;}
.video-tile .feed{position:absolute;inset:0;background:
  linear-gradient(180deg, rgba(5,20,14,.1) 0%, rgba(5,20,14,.5) 100%),
  url('../shared/assets/table-live.jpg') center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;}
.video-tile .felt{width:82%;height:62%;border:2px solid rgba(217,178,106,.35);border-radius:50%;position:relative;}
.video-tile .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--danger);top:8px;left:8px;box-shadow:0 0 8px var(--danger);animation:pulseDot 1.4s infinite;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}
.video-tile .meta{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);padding:8px 10px;font-size:11.5px;display:flex;justify-content:space-between;}
.video-tile .meta b{color:var(--brass);}
.login-role-toggle{display:flex;gap:6px;background:var(--panel-raised);border-radius:var(--radius);padding:3px;border:1px solid var(--line);margin-bottom:6px;}
.login-role-toggle button{flex:1;background:none;border:none;color:var(--ink-faint);font-size:11.5px;font-weight:700;padding:7px 0;border-radius:4px;}
.login-role-toggle button.active{background:var(--brass);color:#071120;}
.detail-tabs-body{max-height:56vh;overflow-y:auto;}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:12.5px;}
.kv-grid span{color:var(--ink-faint);}
.kv-grid b{color:var(--ink);font-weight:600;}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:200px;}
.nav-foot-btns{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.dash-summary-card h3{margin:0 0 10px;}
.dash-big-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--brass);}
.dash-big-val .delta{font-size:13px;font-weight:600;margin-left:6px;}
.dash-big-val .delta.pos{color:var(--jade);}
.dash-big-val .delta.neg{color:var(--danger);}
.dash-metric-row{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;}
.dash-metric{flex:1;min-width:78px;}
.dash-metric .lbl{font-size:11px;color:var(--ink-faint);font-weight:600;}
.dash-metric .val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink);margin-top:4px;}
.dash-metric .mini-bar{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--brass),#4A9FD8);margin-top:8px;opacity:.55;}
.search-inline{width:100%;background:var(--void);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:var(--radius);font-size:12px;}
.search-inline:focus{outline:none;border-color:var(--brass);}
.nav-foot-btns button{font-size:10px;padding:5px 8px;opacity:.55;background:transparent;border:1px solid var(--line);color:var(--ink-faint);border-radius:4px;transition:.15s;}
.nav-foot-btns button:hover{opacity:1;border-color:var(--brass-dim);color:var(--brass);}
</style>
</head>
<!-- admin-app is what scopes the phone layout in shared/cage-ui.css to this app -->
<body class="admin-app">

<div id="login-gate">
  <div class="login-card">
    <button type="button" class="icon-btn login-theme-btn theme-toggle-btn" onclick="toggleLoginTheme()" data-i18n-title="displaySettings" title="화면 설정">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <div class="login-mark">PARTNER ADMIN</div>
    <div class="login-ver">v5.0</div>
    <div class="login-lang-row" id="loginLangRow"></div>
    <div class="field" style="margin-top:22px;"><label data-i18n="partnerIdLabel">파트너 ID</label><input id="loginId" placeholder="admin" autocomplete="off"></div>
    <div class="field"><label data-i18n="loginPw">비밀번호</label><input id="loginPw" type="password" placeholder="••••" autocomplete="new-password"></div>
    <p class="login-error" id="loginErr" data-i18n="agentLoginErr" style="display:none;">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <button class="btn btn-gold btn-block" onclick="doLogin()" data-i18n="loginBtn">로그인</button>
    <p class="login-hint"><span data-i18n="demoAccountLabel">데모 계정</span>: <b style="color:var(--ink-dim);">admin / 0000</b></p>
    <p class="login-hint" id="seedHint" data-i18n="agentSeedHint">최초 실행 시 데모 데이터가 없으면 로그인 후 좌측 하단 "데모 데이터 생성"을 눌러주세요.</p>
  </div>
</div>

<div class="topbar" style="display:none;" id="topbar">
  <!-- the drawer handle; the stylesheet shows it only where the sidebar has become a drawer -->
  <button class="nav-toggle" onclick="toggleNavDrawer()" aria-label="메뉴" title="메뉴">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand"><span class="mark">PARTNER ADMIN</span><span class="ver">v5.0</span></div>
  <div class="divider-v"></div>
  <div class="topbar-meta">
    <span id="clockTxt" class="num">—</span>
    <span><span class="badge-dot" id="connDot"></span> <span class="hide-sm">실시간 연동</span></span>
  </div>
  <div class="topbar-meta" style="margin-left:auto;">
    <span id="hdrLangRow"></span>
    <button type="button" class="icon-btn theme-toggle-btn" onclick="toggleLoginTheme()" data-i18n-title="displaySettings" title="화면 설정">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <span class="hide-sm">로그인:</span><b id="staffNameTxt">—</b>
    <button class="btn btn-sm btn-ghost" onclick="doLogout()">로그아웃</button>
  </div>
</div>

<div class="shell" id="shell" style="display:none;">
  <div class="nav-scrim" onclick="closeNavDrawer()"></div>
  <div class="nav" id="navBar"></div>
  <div class="main">
    <div id="mainArea"></div>
  </div>
</div>

<!-- generic detail modal (member 360) -->
<div class="modal-bg" id="modal-detail"><div class="modal modal-lg">
  <button class="modal-close" onclick="closeModal('modal-detail')">×</button>
  <h3 id="detailTitle">회원 상세정보</h3>
  <p class="hint" id="detailSub"></p>
  <div class="tabs-mini" id="detailTabs"></div>
  <div class="detail-tabs-body" id="detailBody"></div>
</div></div>

<!-- generic balance adjust modal -->
<div class="modal-bg" id="modal-balance"><div class="modal">
  <button class="modal-close" onclick="closeBalanceModal()">×</button>
  <h3 id="balanceModalTitle">보유금 지급</h3>
  <p class="hint" id="balanceModalSub"></p>
  <!-- the member's balance as it stands right now, read live: an operator adjusting a figure
       should not have to leave the popup to find out what they are adjusting -->
  <div class="stat-card" id="balanceModalNow" style="margin-bottom:12px;">
    <div class="lbl">현재 보유금</div><div class="val" id="balanceModalNowVal">—</div>
  </div>
  <div class="field"><label>금액</label><input id="balanceAmt" type="text" inputmode="numeric" placeholder="0" oninput="formatNumInput(this)"></div>
  <div class="field"><label>메모</label><textarea id="balanceMemo" placeholder="사유를 입력하세요"></textarea></div>
  <div class="modal-foot">
    <button class="btn" onclick="closeBalanceModal()">취소</button>
    <button class="btn btn-gold" onclick="submitBalanceAdjust()">처리</button>
  </div>
</div></div>

<!-- generic simple create/edit form modal -->
<div class="modal-bg" id="modal-form"><div class="modal">
  <button class="modal-close" onclick="closeModal('modal-form')">×</button>
  <h3 id="formModalTitle">생성</h3>
  <div id="formModalBody"></div>
  <div class="modal-foot">
    <button class="btn" onclick="closeModal('modal-form')">취소</button>
    <button class="btn btn-gold" id="formModalSubmitBtn">저장</button>
  </div>
</div></div>

<!-- confirm modal -->
<div class="modal-bg" id="modal-confirm"><div class="modal" style="width:380px;">
  <h3 id="confirmTitle">확인</h3>
  <p class="hint" id="confirmBody" style="font-size:13px;color:var(--ink-dim);"></p>
  <div class="modal-foot">
    <button class="btn" onclick="closeModal('modal-confirm')">취소</button>
    <button class="btn btn-danger-fill" id="confirmOkBtn">확인</button>
  </div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../shared/cage-ui.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/payout.js"></script>
<script src="app.js"></script>
</body>
</html>
